version: '3.8'

services:
  studio-os:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SQL_HOST=db
      - SQL_DB_NAME=studio_os
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: studio_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
